<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Finance Agent | Faithway AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800">
    
    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-semibold tracking-tight">Faithway AI <span class="text-slate-400 text-sm font-normal ml-2">| B2B Finance Compliance Agent</span></h1>
    </header>

    <!-- Chat Interface -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 w-full max-w-4xl mx-auto flex flex-col" id="chat-container">
        <!-- AI Greeting -->
        <div class="flex items-start">
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 max-w-[85%]">
                <p class="text-sm md:text-base leading-relaxed">Hello. I am the B2B Finance Compliance Agent. Ask me about our Merchant Cash Advance policies, UK GDPR guidelines, or data retention schedules.</p>
            </div>
        </div>
    </main>

    <!-- Input Box -->
    <footer class="bg-white border-t border-gray-200 p-4 sticky bottom-0">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-slate-900 text-sm md:text-base shadow-sm" placeholder="Type your question here..." required>
            <button type="submit" id="submit-btn" class="bg-slate-900 text-white px-6 py-3 rounded-lg hover:bg-slate-800 transition font-medium text-sm md:text-base shadow-sm disabled:opacity-50">Send</button>
        </form>
    </footer>

    <!-- Logic -->
    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');
        const submitBtn = document.getElementById('submit-btn');

        function appendMessage(text, isUser) {
            const row = document.createElement('div');
            row.className = `flex items-start ${isUser ? 'justify-end' : ''}`;
            
            const bubble = document.createElement('div');
            bubble.className = `p-4 rounded-lg shadow-sm max-w-[85%] text-sm md:text-base leading-relaxed ${
                isUser 
                ? 'bg-slate-900 text-white border border-slate-900' 
                : 'bg-white border border-gray-200 text-gray-800'
            }`;
            bubble.textContent = text;
            
            row.appendChild(bubble);
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;

            // UI State: Loading
            input.value = '';
            input.disabled = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            appendMessage(question, true);

            try {
                // Fetch from the local FastAPI backend
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const data = await response.json();
                appendMessage(data.answer, false);
            } catch (error) {
                appendMessage('System Error: The compliance agent is currently unreachable.', false);
                console.error("API Error:", error);
            } finally {
                // UI State: Ready
                input.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send';
                input.focus();
            }
        });
    </script>
</body>
</html>
